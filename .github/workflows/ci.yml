name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # TEMPORARY (Rose-era one-shot): the committed baselines predate the Rose
  # Engine and cannot be regenerated outside the CI rendering environment
  # (local pixels fail the strict cross-build tolerance). While this flag is
  # "true" the Guardian visual step runs in --update-snapshots mode and
  # commits the CI-rendered baselines back to the branch via the Git Data
  # API. Flip to "false" (strict gate) once the CI-born baselines land.
  GUARDIAN_ADOPT_BASELINES: "true"

jobs:
  validate:
    name: Typecheck, test, build, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify
        # Typecheck and build cannot detect a metadata regression, a locale
        # routing mistake, personal data leaking into an event or a support
        # report, an authorization hole, or a World Command authority drift.
        run: pnpm run verify

      - name: LENA Guardian static integrity
        run: node test/lena-runtime-visual-guardian-v1/scripts/verify-assets.mjs

  guardian-browser:
    name: LENA Guardian browser + visual
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested PR merge
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm run build

      - name: Install Guardian dependencies
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm ci

      - name: Install Chromium
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npx playwright install --with-deps chromium

      - name: Static asset contract
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run verify:assets

      - name: Runtime smoke
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:smoke

      - name: Runtime safety
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:safety

      - name: Visual regression
        working-directory: test/lena-runtime-visual-guardian-v1
        run: |
          if [ "$GUARDIAN_ADOPT_BASELINES" = "true" ]; then
            echo "::notice::GUARDIAN_ADOPT_BASELINES=true — refreshing baselines instead of gating."
            npm run test:update
          else
            npm run test:visual
          fi

      - name: Commit refreshed baselines back to the branch
        if: env.GUARDIAN_ADOPT_BASELINES == 'true'
        shell: bash
        run: |
          set -uo pipefail
          fail() { echo "::error::baseline-commit: $1"; exit 1; }

          git add test/lena-runtime-visual-guardian-v1/screenshots || fail "git add"
          CHANGED=$(git diff --cached --name-only)
          if [ -z "$CHANGED" ]; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi
          echo "Changed baselines:"; echo "$CHANGED"

          BRANCH="${{ github.head_ref || github.ref_name }}"

          # The checked-out ref is the PR merge commit; anchor the new commit
          # on the actual branch tip so the history stays linear.
          git fetch origin "refs/heads/$BRANCH" 2>/tmp/fetch.err || { echo "::error::baseline-commit: fetch failed: $(cat /tmp/fetch.err | tr '\n' ' ')"; exit 1; }
          TIP=$(git rev-parse FETCH_HEAD)
          echo "branch tip: $TIP"

          git config user.name "github-actions[bot]" || fail "git config name"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || fail "git config email"

          # Index now holds the CI-rendered baselines; write that tree and
          # parent the commit on the branch tip.
          TREE=$(git write-tree) || fail "write-tree"
          COMMIT=$(git commit-tree "$TREE" -p "$TIP" -m "chore(guardian): refresh visual baselines for the Rose Engine era") || fail "commit-tree"
          echo "new commit: $COMMIT"

          PUSH_OUT=$(git push origin "$COMMIT:refs/heads/$BRANCH" 2>&1) || {
            echo "::error::baseline-commit: push failed: $(echo "$PUSH_OUT" | tr '\n' ' ')"
            exit 1
          }
          echo "Committed refreshed baselines as $COMMIT on $BRANCH"

      - name: Upload Guardian diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lena-guardian-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test/lena-runtime-visual-guardian-v1/test-results
            test/lena-runtime-visual-guardian-v1/playwright-report
