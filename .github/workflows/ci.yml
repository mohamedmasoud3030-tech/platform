name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # TEMPORARY (Rose-era one-shot): the visual baselines predate the Rose
  # Engine and must be reborn in the CI rendering environment. While this
  # flag is "true" the Guardian visual step runs in --update-snapshots mode
  # and commits refreshed baselines back to the branch. Revert to "false"
  # (strict gate) once the Rose-era baselines are committed.
  GUARDIAN_ADOPT_BASELINES: "true"

jobs:
  validate:
    name: Typecheck, test, build, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify
        # Typecheck and build cannot detect a metadata regression, a locale
        # routing mistake, personal data leaking into an event or a support
        # report, an authorization hole, or a World Command authority drift.
        run: pnpm run verify

      - name: LENA Guardian static integrity
        run: node test/lena-runtime-visual-guardian-v1/scripts/verify-assets.mjs

  guardian-browser:
    name: LENA Guardian browser + visual
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested PR merge
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm run build

      - name: Install Guardian dependencies
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm ci

      - name: Install Chromium
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npx playwright install --with-deps chromium

      - name: Static asset contract
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run verify:assets

      - name: Runtime smoke
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:smoke

      - name: Runtime safety
        working-directory: test/lena-runtime-visual-guardian-v1
        run: npm run test:safety

      - name: Visual regression
        working-directory: test/lena-runtime-visual-guardian-v1
        run: |
          if [ "$GUARDIAN_ADOPT_BASELINES" = "true" ]; then
            echo "::notice::GUARDIAN_ADOPT_BASELINES=true — refreshing baselines instead of gating."
            npm run test:update
          else
            npm run test:visual
          fi

      - name: Commit refreshed baselines back to the branch
        if: env.GUARDIAN_ADOPT_BASELINES == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          fail() { echo "::error::baseline-commit: $1"; exit 1; }
          apicall() { # $1=description $2=output-file, rest=gh api args
            local desc="$1" outfile="$2"; shift 2
            local rc
            gh api "$@" > "$outfile" 2>&1; rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::baseline-commit: $desc failed (rc=$rc): $(head -c 1500 "$outfile" 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
          }

          apicall "auth check" /tmp/whoami.txt user --jq '.login' || exit 1
          echo "API identity: $(cat /tmp/whoami.txt)"

          git add test/lena-runtime-visual-guardian-v1/screenshots || fail "git add"
          CHANGED=$(git diff --cached --name-only)
          if [ -z "$CHANGED" ]; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi
          echo "Changed baselines:"; echo "$CHANGED"

          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO="mohamedmasoud3030-tech/platform"

          apicall "read branch ref" /tmp/base.sha "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha' || exit 1
          BASE_SHA=$(cat /tmp/base.sha)
          apicall "read base tree" /tmp/base.tree "repos/$REPO/git/commits/$BASE_SHA" --jq '.tree.sha' || exit 1
          BASE_TREE=$(cat /tmp/base.tree)

          TREE_ITEMS="[]"
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ -f "$FILE" ] || fail "missing file $FILE"
            B64=$(base64 -w0 "$FILE")
            jq -n --arg c "$B64" '{content:$c, encoding:"base64"}' > /tmp/blob.json
            apicall "create blob for $FILE" /tmp/blob.sha "repos/$REPO/git/blobs" --input /tmp/blob.json --jq '.sha' || exit 1
            BLOB_SHA=$(cat /tmp/blob.sha)
            TREE_ITEMS=$(jq -c --arg p "$FILE" --arg s "$BLOB_SHA" '. + [{path:$p, mode:"100644", type:"blob", sha:$s}]' <<< "$TREE_ITEMS")
          done <<< "$CHANGED"

          jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ITEMS" '{base_tree:$base, tree:$tree}' > /tmp/tree.json
          apicall "create tree" /tmp/tree.sha "repos/$REPO/git/trees" --input /tmp/tree.json --jq '.tree.sha' || exit 1
          TREE_SHA=$(cat /tmp/tree.sha)

          jq -n --arg msg "chore(guardian): refresh visual baselines for the Rose Engine era" \
                --arg tree "$TREE_SHA" --arg parent "$BASE_SHA" \
                '{message:$msg, tree:$tree, parents:[$parent]}' > /tmp/commit.json
          apicall "create commit" /tmp/commit.sha "repos/$REPO/git/commits" --input /tmp/commit.json --jq '.sha' || exit 1
          COMMIT_SHA=$(cat /tmp/commit.sha)

          apicall "update ref" /tmp/ref.out -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$COMMIT_SHA" || exit 1
          echo "Committed refreshed baselines as $COMMIT_SHA on $BRANCH"

      - name: Upload Guardian diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lena-guardian-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test/lena-runtime-visual-guardian-v1/test-results
            test/lena-runtime-visual-guardian-v1/playwright-report
