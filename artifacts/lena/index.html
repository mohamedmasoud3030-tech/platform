<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LENA Digital House — بيت رقمي يبني أنظمة تشغيل للأعمال الحقيقية ويجمعها داخل عالم LENA واحد." />
    <meta name="theme-color" content="#030612" />
    <meta property="og:title" content="LENA Digital House" />
    <meta property="og:description" content="Operating systems for real businesses, connected inside one LENA World." />
    <meta property="og:image" content="%BASE_URL%lena-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>LENA Digital House</title>
    <!--
      The stored register is applied before the first paint. Without this the
      document paints in the default ink palette and then flips to paper, which
      reads as a flash of the wrong house on every visit.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("lena-digital-house.theme");
          var theme = stored === "light" ? "light" : "dark";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f2ecdd" : "#030612");
        } catch (error) {
          /* Storage blocked: the default dark register stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
